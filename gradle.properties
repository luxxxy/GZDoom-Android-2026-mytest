# Project-wide Gradle settings.
# Keep machine-specific Java paths out of this shared file; CI and local
# Gradle installations should use their configured JAVA_HOME.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048M

kotlin.code.style=official

# AndroidX (required). Transitive R class kept on (code references resources across modules).
android.useAndroidX=true
android.nonTransitiveRClass=false
