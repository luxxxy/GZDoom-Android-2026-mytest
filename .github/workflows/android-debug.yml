name: Android debug APK

on:
  push:
    branches:
      - mobile-ui-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses

      - name: Build native engine libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x ./build_native.sh
          ./build_native.sh -j2

      - name: Build Android debug APK
        run: ./gradlew :doom:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gzdoom-android-debug
          path: doom/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
